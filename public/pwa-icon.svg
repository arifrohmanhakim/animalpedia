  <path d="M256 160 L256 130" stroke="#3D2B1F" stroke-width="4" stroke-linecap="round"/>
  <path d="M230 165 L220 135" stroke="#3D2B1F" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M282 165 L292 135" stroke="#3D2B1F" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M206 178 L190 152" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round"/>
  <path d="M306 178 L322 152" stroke="#3D2B1F" stroke-width="3" stroke-linecap="round"/>

