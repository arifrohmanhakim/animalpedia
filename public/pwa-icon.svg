  <line x1="200" y1="270" x2="138" y2="272" stroke="#3D2B1F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="280" x2="140" y2="292" stroke="#3D2B1F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="312" y1="260" x2="372" y2="252" stroke="#3D2B1F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="312" y1="270" x2="374" y2="272" stroke="#3D2B1F" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="312" y1="280" x2="372" y2="292" stroke="#3D2B1F" stroke-width="2.5" stroke-linecap="round"/>

