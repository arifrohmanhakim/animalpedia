<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#E67300"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Tiger face - main shape -->
  <ellipse cx="256" cy="275" rx="140" ry="135" fill="#FFB347"/>
  <ellipse cx="256" cy="275" rx="130" ry="125" fill="#FFC04D"/>

  <!-- Ears -->
  <ellipse cx="145" cy="185" rx="40" ry="38" fill="#FF8C00"/>
  <ellipse cx="367" cy="185" rx="40" ry="38" fill="#FF8C00"/>
  <ellipse cx="148" cy="188" rx="24" ry="22" fill="#FFB347"/>
  <ellipse cx="364" cy="188" rx="24" ry="22" fill="#FFB347"/>

  <!-- White face patches -->
  <ellipse cx="215" cy="245" rx="38" ry="32" fill="white"/>
  <ellipse cx="297" cy="245" rx="38" ry="32" fill="white"/>

  <!-- Eyes -->
